# The slate documentation site, built with juicer and the juicerdocs theme.
#
# Local preview:
#
#   juicer serve -s site -L
#
# Production: pushed to `stable`, built and deployed by .github/workflows/docs.yml.
# A push to `dev` builds and does not deploy, so a page is never written blind
# and a doc change does not go live until a release.

title       = "slate"
author      = "Ed Maxedon"
baseURL     = "https://slatelang.dev/"
description = "A small indentation-structured, garbage-collected language. Dynamically typed with a gradual checker, async/await on a real event loop, and a JavaScript back end."

repoURL = "https://github.com/slate-language/slate"

favicon = "slate-favicon.svg"

theme = "juicerdocs"

# **The content root is the repository's own `docs/`, reached by a symlink.**
# `site/content` points at `../docs`, so there is exactly one copy of every
# page: the same file GitHub renders in the repository is the file this site
# builds, and `tests_docs.sysl` — which walks `docs/` and runs every fenced
# program on it — is the check that both are true.
#
# Copying the pages here instead would give the census one tree and the site
# another, and the two would drift the first time somebody edited the wrong one.

# **A section index is `README.md` rather than `_index.md`**, for the same
# reason. GitHub shows a directory's `README.md` under its listing, so that is
# where the introduction to `docs/reference/` has to live; naming it here is
# what makes the same file the section's index page on the site.
folderContent = "README"

# GitHub Pages serves the on-disk layout literally, so the URL space has to
# match the file tree. The `standard` baseline ships htmlDir = "html", which
# strips a segment from URLs but not from paths and breaks the deploy.
htmlDir = ""

# The page `<h1>` comes from the markdown itself — every page under `docs/` opens
# with one, because it is read on GitHub as well as here — so headings are not
# shifted and `layouts/_default/` drops the theme's own `<h1>`. See the note
# in `layouts/_default/file.html`.
headingShift = 0

# **`github`, because these pages are read in two places.** The same markdown is
# browsed on GitHub and rendered here, so a link to `#starts-with` has to resolve
# in both — which means generating the anchor GitHub generates.
slugStyle = "github"

# One override, for the wordmark: the topbar's brand text is hidden, because
# the wordmark already says "slate" and the two sat side by side.
customCSS = ["site.css"]

# Recompile the theme's CSS from SCSS on every build, fingerprint for
# cache-busting, bundle the theme JS. Without `sass` / `esbuild` on PATH
# this degrades to a verbatim copy of the committed sources — the page
# still renders, it just ships whatever CSS was last committed.
[assets]
enabled     = true
fingerprint = true

[[assets.sass]]
input  = "themes/juicerdocs/src/scss/juicerdocs.scss"
output = "/juicerdocs.css"
minify = true

[[assets.esbuild]]
input  = "themes/juicerdocs/static/juicerdocs.js"
output = "/juicerdocs.js"
minify = true

[juicerdocs]
# The wordmark, and the setting it was cut from, recorded here because the
# file itself is outlines and no longer says: **"slate" in Fraunces Italic
# (Undercase Type, OFL), weight 500, SOFT 100, opsz 9, with the `l.alt`
# alternate.** `static/slate-favicon.svg` is its first glyph on its own.
#
# `icon` is left unset so the topbar falls back to this one — there is no
# separate mark to show there, the wordmark IS the brand. No font is loaded on
# the site: the body and code faces are the theme's.
logo = "slate-wordmark.svg"
