<svg xmlns="http://www.w3.org/2000/svg" viewBox="-27.006493506493506 -1497 4521.006493506494 1579.5" color="#101010" role="img" aria-label="slate">
  <title>slate</title>
  <!--
    The wordmark: "slate" in Fraunces Italic, weight 500, SOFT 100, opsz 9, with the `l.alt`
    alternate. Converted to outlines, so no font has to load to draw the mark
    and it is identical wherever it is drawn.

    ONE PATH PER GLYPH, in reading order, each at its own advance — so a single
    letter can be replaced without redrawing the word. `slate-favicon.svg`
    beside this file is the first of them, the "s", on its own.

    `fill="#101010"` so an inlined copy takes the colour of whatever it
    sits in. The `color` on the root is what that resolves against when the
    file is reached through an `<img>`, which is its own document and cannot
    see the page's colour at all — without it the mark comes out black on both
    themes and is invisible on the dark one. It is a presentation attribute, so
    any CSS rule still wins over it. The dark theme inverts the image in
    `site.css`, that being the only form that follows the site's own toggle
    rather than the browser's setting.
