<svg xmlns="http://www.w3.org/2000/svg" viewBox="-27.006493506493506 -1002.5 984.0064935064935 1085.0" role="img" aria-label="slate">
  <title>slate</title>
  <!--
    The wordmark's own "s" — its first path, on its own. Change that glyph and
    this file has to be regenerated with it; nothing checks that, and the two
    are the only place the mark exists.

    **The colour follows the BROWSER here, where the wordmark's follows the
    SITE.** A favicon sits in the browser's chrome rather than on the page, so
    what it has to be legible against is the tab strip — and a tab strip is
    dark when the browser is, whatever theme the reader has chosen for this
    site. That is the one place `prefers-color-scheme` inside the file is the
    right instrument rather than the wrong one, an SVG reached as an icon being
    its own document with no way to see the page at all.
  -->
  <style>
    :root { color: #101010 }
    @media (prefers-color-scheme: dark) { :root { color: #efefef } }
