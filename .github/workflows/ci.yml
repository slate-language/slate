# The Linux build and suite, on every push to `dev`.
#
# **The release workflow is not the place to find out that Linux is broken.** It runs on a tag, by
# which time the version is bumped, `stable` is moved and a release is half cut -- so a Linux-only
# break there is discovered at the worst moment and fixed under a tag that has already been pushed.
# This is the same build a release does, run where a break is cheap.
#
# **One architecture, not two.** Nearly every Linux difference slate can have is a difference from
# macOS rather than between two Linuxes, so a second runner would double the cost to catch the rare
# case; the release workflow builds both and is what says the pair still agree. arm64 is the one
# chosen because it is what the development machine is, so a failure here is a failure the
# development machine can reason about.

name: CI

on:
  push:
    branches: [dev, linux]
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "README.md"
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-22.04-arm

    # A failed `sysl` does not always exit -- the collector prints a stack trace when it cannot grow
    # the heap and the process then sits there -- so every long step carries a deadline of its own
    # inside `scripts/linux-measure.sh` and the job carries this one behind them.
    timeout-minutes: 150

    # **THE COLLECTOR'S CEILING IS THE MACHINE'S PHYSICAL MEMORY, so the swap file below is inert
    # without this.** `sysl` is a Scala Native binary with the Immix collector, whose maximum heap
    # defaults to the RAM the machine has -- 16 GB on a hosted runner -- and past that it does not
    # swap, it fails with `[ScalaNative GC|Error] Out of heap space grow heap`. The large initial
    # heap is the other half: building the standard module allocates almost nothing collectable, so
    # a heap that starts at the default is grown by repeated marking of a heap already too big to
    # walk. The same pair is set in `release-linux.yml`, which builds the same thing.
    env:
      GC_INITIAL_HEAP_SIZE: 8g
      GC_MAXIMUM_HEAP_SIZE: 52g
      SLATE_STEP_TIMEOUT: 60m

    steps:
      - uses: actions/checkout@v4

      # **The compiler wants more than a runner has, so the swap is not a precaution.** It is where
      # the raised ceiling above spends what it is given; without it the same build dies as an OOM
      # kill with no diagnostic of its own. What it actually needed is measured on every run rather
      # than asserted here -- `scripts/linux-measure.sh` prints it.
      - name: Give the runner room to compile
        run: |
          set -euo pipefail
          sudo swapoff -a || true
          sudo fallocate -l 48G /mnt/slate-swap
          sudo chmod 600 /mnt/slate-swap
          sudo mkswap /mnt/slate-swap
          sudo swapon /mnt/slate-swap
          free -g
          df -h /mnt /

      - name: Install the toolchain and the libraries
        run: sudo -E ./scripts/linux-deps.sh

      - name: Put clang on the PATH
        run: echo "/usr/lib/llvm-20/bin" >> "$GITHUB_PATH"

      - name: Install sysl
        run: sudo ./scripts/linux-install-sysl.sh /usr/local

      - name: Report the toolchain
        run: |
          which clang llvm-ar sysl
          clang --version | head -2
          ldd --version | head -1
          sysl --version

      # From the project ROOT, which is load bearing: one test reads `examples/*.sl` by relative
      # path and fails with a missing-file message when it is run from anywhere else.
      - name: Gate
        run: ./scripts/linux-measure.sh "sysl test ." sysl test .

      - name: Build
        run: ./scripts/linux-measure.sh "sysl build ." sysl build .

      - name: Say what was built
        run: |
          ./slate --version
          ldd ./slate
