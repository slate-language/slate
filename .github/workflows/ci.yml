# The macOS build and suite, on every push to `dev`.
#
# **slate is macOS-only until 0.2.0, and the self-hosted sysl alphas publish only a darwin-arm64
# tarball**, so this is the one platform CI can build on. The Linux job that used to be here is gone;
# its install path (`scripts/linux-install-sysl.sh` and the other `linux-*` scripts) is kept
# for `release-linux.yml`, which is manual-only, and for the day Linux returns.
#
# **WHICH sysl BUILDS THIS IS THE REPOSITORY'S `sysl-version` FILE, AND NOTHING HERE.** sysl is
# installed the way a user installs it, from the tap, and `scripts/check-sysl-version.sh` then fails
# the step unless the installed compiler reports `sysl-version` and that is not behind
# `package.hocon`'s floor. **Never pin the version here instead**: a copy in a workflow is a copy
# nothing keeps in step.

name: CI

on:
  push:
    branches: [dev]
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "README.md"
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      # A tap brew has not been told to trust is refused after the download, and the refusal can name
      # a sibling formula rather than this one. Trusting is a no-op on a brew that has no such gate.
      - name: Install sysl
        run: |
          set -euo pipefail
          brew tap sysl-lang/tap
          brew trust sysl-lang/tap || true
          brew install sysl-lang/tap/sysl

      - name: Check the compiler is the one sysl-version names
        run: ./scripts/check-sysl-version.sh

      - name: Report the toolchain
        run: |
          which clang sysl
          clang --version | head -2
          sysl --version

      - name: Build
        run: sysl build .

      - name: Say what was built
        run: |
          ./slate --version
          otool -L ./slate

      # The binary's own suite: `tests/lang` is the language suite and the binary just built runs it,
      # on both back ends.
      - name: Gate
        run: |
          set -euo pipefail
          ./slate test tests/lang
          ./slate test --js tests/lang

      # The C archive a release ships, linked and run, so a push that stops it linking breaks here
      # rather than under a tag. `scripts/embed-check.sh` is the whole check.
      - name: The C archive links and runs
        timeout-minutes: 60
        run: |
          set -euo pipefail
          zsh scripts/embed-check.sh
